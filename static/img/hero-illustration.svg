<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" width="520" height="560">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111820;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emeraldFade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="520" height="560" rx="24" fill="url(#bgGrad)" />
  <rect width="520" height="560" rx="24" fill="none" stroke="#1E2A35" stroke-width="1"/>

  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#34D399" stroke-width="0.5">
    <line x1="0" y1="40" x2="520" y2="40"/>
    <line x1="0" y1="80" x2="520" y2="80"/>
    <line x1="0" y1="120" x2="520" y2="120"/>
    <line x1="0" y1="160" x2="520" y2="160"/>
    <line x1="0" y1="200" x2="520" y2="200"/>
    <line x1="0" y1="240" x2="520" y2="240"/>
    <line x1="0" y1="280" x2="520" y2="280"/>
    <line x1="0" y1="320" x2="520" y2="320"/>
    <line x1="0" y1="360" x2="520" y2="360"/>
    <line x1="0" y1="400" x2="520" y2="400"/>
    <line x1="0" y1="440" x2="520" y2="440"/>
    <line x1="0" y1="480" x2="520" y2="480"/>
    <line x1="0" y1="520" x2="520" y2="520"/>
    <line x1="40" y1="0" x2="40" y2="560"/>
    <line x1="80" y1="0" x2="80" y2="560"/>
    <line x1="120" y1="0" x2="120" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="560"/>
    <line x1="200" y1="0" x2="200" y2="560"/>
    <line x1="240" y1="0" x2="240" y2="560"/>
    <line x1="280" y1="0" x2="280" y2="560"/>
    <line x1="320" y1="0" x2="320" y2="560"/>
    <line x1="360" y1="0" x2="360" y2="560"/>
    <line x1="400" y1="0" x2="400" y2="560"/>
    <line x1="440" y1="0" x2="440" y2="560"/>
    <line x1="480" y1="0" x2="480" y2="560"/>
  </g>

  <!-- Large ambient glow -->
  <circle cx="260" cy="250" r="180" fill="#10B981" opacity="0.04" filter="url(#softGlow)"/>

  <!-- Outer orbital ring -->
  <ellipse cx="260" cy="270" rx="190" ry="190" fill="none" stroke="#1E2A35" stroke-width="1.5" stroke-dasharray="6 8"/>
  <ellipse cx="260" cy="270" rx="140" ry="140" fill="none" stroke="#10B981" stroke-width="0.8" opacity="0.2" stroke-dasharray="4 6"/>

  <!-- Central hexagon brain -->
  <g transform="translate(260,250)">
    <!-- Hex background -->
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="url(#emeraldFade)" stroke="#10B981" stroke-width="1.5" opacity="0.9"/>
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#0B0F14" stroke="#1E2A35" stroke-width="1"/>

    <!-- Brain circuit lines inside hex -->
    <g stroke="#10B981" stroke-width="1.5" opacity="0.7" fill="none" stroke-linecap="round">
      <path d="M-20,-30 L-20,-10 L0,0 L20,-10 L20,-30"/>
      <path d="M0,0 L0,20 L-15,35"/>
      <path d="M0,20 L15,35"/>
      <path d="M-30,0 L-20,-10"/>
      <path d="M30,0 L20,-10"/>
      <path d="M-10,-25 L10,-25"/>
    </g>

    <!-- Neural nodes -->
    <circle cx="0" cy="0" r="4" fill="#10B981" filter="url(#glow)"/>
    <circle cx="-20" cy="-10" r="3" fill="#34D399"/>
    <circle cx="20" cy="-10" r="3" fill="#34D399"/>
    <circle cx="0" cy="20" r="3" fill="#34D399"/>
    <circle cx="-20" cy="-30" r="2.5" fill="#6EE7B7"/>
    <circle cx="20" cy="-30" r="2.5" fill="#6EE7B7"/>
    <circle cx="-15" cy="35" r="2.5" fill="#6EE7B7"/>
    <circle cx="15" cy="35" r="2.5" fill="#6EE7B7"/>
    <circle cx="-30" cy="0" r="2" fill="#6EE7B7" opacity="0.7"/>
    <circle cx="30" cy="0" r="2" fill="#6EE7B7" opacity="0.7"/>
    <circle cx="-10" cy="-25" r="2" fill="#A7F3D0" opacity="0.6"/>
    <circle cx="10" cy="-25" r="2" fill="#A7F3D0" opacity="0.6"/>
  </g>

  <!-- Orbiting nodes on outer ring -->
  <g filter="url(#glow)">
    <circle cx="260" cy="80" r="8" fill="#10B981"/>
    <circle cx="420" cy="180" r="6" fill="#34D399"/>
    <circle cx="100" cy="350" r="6" fill="#34D399"/>
    <circle cx="430" cy="370" r="7" fill="#10B981"/>
    <circle cx="90" cy="180" r="5" fill="#6EE7B7"/>
    <circle cx="360" cy="440" r="5" fill="#6EE7B7"/>
  </g>

  <!-- Connection lines from nodes to center -->
  <g stroke="#10B981" stroke-width="0.8" opacity="0.15">
    <line x1="260" y1="80" x2="260" y2="170"/>
    <line x1="420" y1="180" x2="330" y2="220"/>
    <line x1="100" y1="350" x2="191" y2="290"/>
    <line x1="430" y1="370" x2="329" y2="290"/>
    <line x1="90" y1="180" x2="191" y2="220"/>
    <line x1="360" y1="440" x2="300" y2="330"/>
  </g>

  <!-- Floating data blocks - top left -->
  <g transform="translate(50,60)" opacity="0.8">
    <rect width="100" height="36" rx="8" fill="#111820" stroke="#1E2A35" stroke-width="1"/>
    <rect x="10" y="10" width="32" height="4" rx="2" fill="#10B981" opacity="0.6"/>
    <rect x="10" y="20" width="50" height="4" rx="2" fill="#1E2A35"/>
    <rect x="66" y="20" width="24" height="4" rx="2" fill="#10B981" opacity="0.3"/>
  </g>

  <!-- Floating data block - top right -->
  <g transform="translate(370,50)" opacity="0.7">
    <rect width="110" height="44" rx="8" fill="#111820" stroke="#1E2A35" stroke-width="1"/>
    <rect x="10" y="10" width="20" height="4" rx="2" fill="#34D399" opacity="0.5"/>
    <rect x="34" y="10" width="40" height="4" rx="2" fill="#1E2A35"/>
    <rect x="10" y="20" width="60" height="4" rx="2" fill="#1E2A35"/>
    <rect x="10" y="30" width="35" height="4" rx="2" fill="#10B981" opacity="0.4"/>
    <rect x="50" y="30" width="50" height="4" rx="2" fill="#1E2A35"/>
  </g>

  <!-- Floating data block - bottom left -->
  <g transform="translate(40,440)" opacity="0.6">
    <rect width="120" height="52" rx="8" fill="#111820" stroke="#1E2A35" stroke-width="1"/>
    <circle cx="20" cy="16" r="6" fill="#10B981" opacity="0.25" stroke="#10B981" stroke-width="1" opacity="0.4"/>
    <rect x="34" y="12" width="50" height="4" rx="2" fill="#1E2A35"/>
    <rect x="34" y="20" width="30" height="3" rx="1.5" fill="#1E2A35" opacity="0.6"/>
    <rect x="10" y="32" width="100" height="4" rx="2" fill="#10B981" opacity="0.08"/>
    <rect x="10" y="32" width="65" height="4" rx="2" fill="#10B981" opacity="0.3"/>
    <rect x="10" y="42" width="100" height="4" rx="2" fill="#10B981" opacity="0.08"/>
    <rect x="10" y="42" width="40" height="4" rx="2" fill="#10B981" opacity="0.2"/>
  </g>

  <!-- Floating data block - bottom right -->
  <g transform="translate(380,470)" opacity="0.65">
    <rect width="100" height="44" rx="8" fill="#111820" stroke="#1E2A35" stroke-width="1"/>
    <rect x="10" y="12" width="16" height="16" rx="4" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="0.8" opacity="0.3"/>
    <text x="14" y="24" font-family="monospace" font-size="8" fill="#10B981" opacity="0.8">01</text>
    <rect x="34" y="12" width="40" height="4" rx="2" fill="#1E2A35"/>
    <rect x="34" y="20" width="55" height="3" rx="1.5" fill="#1E2A35" opacity="0.5"/>
    <rect x="10" y="34" width="80" height="3" rx="1.5" fill="#1E2A35" opacity="0.4"/>
  </g>

  <!-- Robot head outline -->
  <g transform="translate(260,255)" opacity="0.12" stroke="#34D399" stroke-width="1" fill="none">
    <rect x="-22" y="-100" width="44" height="30" rx="6"/>
    <circle cx="-10" cy="-88" r="3"/>
    <circle cx="10" cy="-88" r="3"/>
    <line x1="-6" y1="-78" x2="6" y2="-78"/>
  </g>

  <!-- Decorative dots pattern -->
  <g fill="#10B981" opacity="0.1">
    <circle cx="460" cy="120" r="1.5"/>
    <circle cx="470" cy="120" r="1.5"/>
    <circle cx="480" cy="120" r="1.5"/>
    <circle cx="460" cy="130" r="1.5"/>
    <circle cx="470" cy="130" r="1.5"/>
    <circle cx="480" cy="130" r="1.5"/>
    <circle cx="460" cy="140" r="1.5"/>
    <circle cx="470" cy="140" r="1.5"/>
    <circle cx="480" cy="140" r="1.5"/>

    <circle cx="40" cy="380" r="1.5"/>
    <circle cx="50" cy="380" r="1.5"/>
    <circle cx="60" cy="380" r="1.5"/>
    <circle cx="40" cy="390" r="1.5"/>
    <circle cx="50" cy="390" r="1.5"/>
    <circle cx="60" cy="390" r="1.5"/>
  </g>

  <!-- Label badge -->
  <g transform="translate(180,490)">
    <rect width="160" height="32" rx="16" fill="#111820" stroke="#1E2A35" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#10B981" opacity="0.8"/>
    <text x="34" y="20" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#9CA3AF" letter-spacing="0.05em">PHYSICAL AI</text>
  </g>
</svg>
